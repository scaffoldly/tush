name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    # Defaults are [opened, synchronize, reopened]. Add ready_for_review
    # so a draft -> ready transition re-runs CI without an empty push;
    # keep synchronize explicit so every new commit on the PR triggers a
    # fresh run.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x64 + arm64 across linux and macos, all pinned to discrete image
        # labels (no *-latest aliases) so every cell names an explicit version.
        # macos-26-intel is x64 (Intel), macos-26 is arm64 (Apple Silicon).
        # Bumping an image label renames its check context, so update the
        # branch-protection required contexts when bumping. gofmt runs
        # Linux-only (see below), covering both Linux cells.
        #
        # No Windows: the host side puts the shell on a pseudo-terminal and
        # hands it a controlling terminal for job control, which Windows has no
        # equivalent of. tush cross-compiles for it, but nothing would work.
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26-intel
          - macos-26
        # "min" reads the floor from go.mod (the `go X.Y` directive); "stable"
        # is whatever setup-go's `stable` alias resolves to. Keeping "min"
        # symbolic avoids drift between go.mod and the workflow when the floor
        # is bumped.
        go: [min, stable]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: resolve go version
        id: goversion
        # "min" → the `go X.Y` directive in go.mod (the declared floor).
        # Anything else (e.g. "stable") passes through unchanged so setup-go's
        # aliases keep working.
        run: |
          if [ "${{ matrix.go }}" = "min" ]; then
            v=$(awk '/^go [0-9]/ {print $2; exit}' go.mod)
            echo "version=$v" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ matrix.go }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
          cache: true

      - name: gofmt
        # Linux-only: one canonical LF tree is enough to enforce formatting.
        if: runner.os == 'Linux'
        run: make fmt-check

      # The make targets export CGO_ENABLED=0 (see Makefile) — tush is pure Go,
      # and a static binary is what makes it droppable into a minimal image.
      - name: go vet
        run: make vet

      - name: go build
        run: make build

      # The console and client packages open real pseudo-terminals and run the
      # runner's shell, so these exercise the actual tty path rather than pipes.
      - name: tests
        run: make test

      # One cell per OS runs the live e2e tier (a real tunnel from
      # tunnel.pizza) so platform-specific behavior is exercised on both Linux
      # and macOS without minting from all 8 cells, which would trip the
      # provider's rate limits. Without TUSH_E2E the e2e package skips, so the
      # other cells still compile it.
      - name: e2e
        env:
          TUSH_E2E: ${{ matrix.go == 'stable' && contains(fromJSON('["ubuntu-24.04", "macos-26"]'), matrix.os) && '1' || '' }}
        run: make e2e

  # Race detector lane. Separate from the matrix because the detector needs CGO
  # (the matrix forces CGO_ENABLED=0 for cross-host determinism). Linux/amd64
  # with the module's Go floor is enough — the races this guards are in the
  # console's shared state, where one reader fans output out to whichever client
  # is attached, not in anything platform-specific.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: race tests
        # Run go directly (not make, which exports CGO_ENABLED=0) with CGO on so
        # the race detector links. No live e2e — TUSH_E2E unset, so the e2e
        # package's cases skip.
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

  release:
    needs: [ci, race]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push tag + create release
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: resolve tag
        id: tag
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Manual tag push (minor/major bumps): use the tag as-is.
            echo "tag=${GITHUB_REF_NAME}"      >> "$GITHUB_OUTPUT"
            echo "needs_push=false"            >> "$GITHUB_OUTPUT"
            echo "skip=false"                  >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main push: skip release if the commit opted out or already has a tag.
          # Token must sit alone on its own line so prose mentioning it inline
          # (subjects, doc paragraphs) doesn't accidentally suppress the release.
          msg=$(git log -1 --pretty=%B)
          if grep -qE '^[[:space:]]*\[skip release\][[:space:]]*$' <<<"$msg"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # Auto-bump patch from the latest v* tag (default v0.0.1 for first release).
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="v0.0.1"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=${next}"      >> "$GITHUB_OUTPUT"
          echo "needs_push=true"  >> "$GITHUB_OUTPUT"
          echo "skip=false"       >> "$GITHUB_OUTPUT"

      - name: push tag
        if: steps.tag.outputs.skip != 'true' && steps.tag.outputs.needs_push == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: create github release
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes

      - name: install cosign
        if: steps.tag.outputs.skip != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: build release binaries
        if: steps.tag.outputs.skip != 'true'
        run: make dist VERSION="${{ steps.tag.outputs.tag }}"

      - name: sign and upload release binaries
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"

          # Cross-compiled binaries plus their checksum manifest, each signed
          # with cosign in keyless mode (OIDC -> Fulcio cert -> Rekor
          # transparency log) — the .sigstore bundle carries signature, cert,
          # and log entry. Runs before "sign source archives" because
          # `make dist` recreates dist/ from scratch.
          for f in dist/tush_* dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "${f}.sigstore" "$f"
          done

          # Upload the whole dist/ in one pass: binaries, SHA256SUMS, and the
          # .sigstore bundles just written. A single glob avoids listing the
          # sigstores twice (dist/tush_* would also match them), which would
          # make gh reject the batch as duplicate assets.
          gh release upload "${tag}" dist/* --clobber

      - name: sign source archives
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"
          mkdir -p dist

          # Pull the auto-generated source archives that GitHub publishes
          # alongside every tag, then sign them with cosign in keyless mode
          # (OIDC -> Fulcio cert -> Rekor transparency log). The signature,
          # cert, and Rekor entry are bundled in a single .sigstore file.
          for ext in tar.gz zip; do
            curl -fsSL "https://github.com/${repo}/archive/refs/tags/${tag}.${ext}" \
              -o "dist/${tag}.${ext}"
            cosign sign-blob --yes \
              --bundle "dist/${tag}.${ext}.sigstore" \
              "dist/${tag}.${ext}"
          done

          gh release upload "${tag}" \
            "dist/${tag}.tar.gz.sigstore" \
            "dist/${tag}.zip.sigstore"
